# Monthly, grouped, capped: self-hosted CI runs every PR, so keep the volume low.
# Security updates arrive on their own (grouped below), whatever the schedule.
version: 2
updates:
  - package-ecosystem: swift
    directories: ["/DockPeek", "/Latent", "/LinkRoutes", "/MacTools", "/ScreenWren", "/ScrollSplit", "/Sift"]
    schedule:
      interval: monthly
      time: "07:20"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      # Deliberate pin (MacTools/Package.swift, exact: "2.10.0"): the release
      # tooling and Sparkle signing key are matched to it. Weekly upkeep checks
      # Sparkle advisories; bump by hand after re-checking scripts/release.sh.
      - dependency-name: "github.com/sparkle-project/sparkle"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      swift-security:
        applies-to: security-updates
        patterns: ["*"]
      swift-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
      swift-major:
        update-types: [major]
        patterns: ["*"]
  - package-ecosystem: pip
    directories: ["/Latent/scripts"]
    schedule:
      interval: monthly
      time: "07:20"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      # coremltools 9.0 can't convert on NumPy 2 (see Latent/scripts/requirements.txt).
      # Revisit when coremltools moves past 9.0.
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
      pip-major:
        update-types: [major]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule: { interval: monthly, time: "07:20", timezone: America/Chicago }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
