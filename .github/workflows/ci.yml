name: Mac Tools

on:
  push:
    branches: [main, master]
    paths-ignore: ['.github/workflows/latent.yml', '.github/workflows/sift.yml']
  pull_request:
    paths-ignore: ['.github/workflows/latent.yml', '.github/workflows/sift.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The runner is Andrew's laptop and this repository is public, so a fork's
    # pull request must never reach it. Fork PRs skip the job; same-repo
    # branches, pushes to main and manual runs still build.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Andrew's own macOS runner must have macOS 26+ and Swift 6.2+ / matching Xcode.
    runs-on: [self-hosted, macOS, ARM64, air]
    # Latent and Sift build twice each (arm64 and x86_64) as Mac Tools payloads.
    timeout-minutes: 75
    env:
      SCREENWREN_SIGNING_IDENTITY: '-'
      SCREENWREN_SIGNING_TIMESTAMP: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check toolchain
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          xcrun swift --version
          xcrun --show-sdk-path
      - name: Test and package every app
        run: ./verify.sh
      - name: Upload verified suite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mac-Tools
          path: dist/Mac-Tools-*.zip
          if-no-files-found: error
