name: Latent

on:
  pull_request:
    paths: ['Latent/**', '.github/workflows/latent.yml']
  push:
    branches: [main]
    paths: ['Latent/**', '.github/workflows/latent.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Latent

jobs:
  build:
    name: Build and self-verify
    # The runner is a personal laptop and this repo is public, so a fork's
    # pull request must never reach it. Fork PRs skip the job; same-repo
    # branches, pushes to main and manual runs still build.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, air]

    timeout-minutes: 30

    env:
      CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/clang-module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/swiftpm-module-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same-owner native checkout: keep Git ownership checks and avoid copying the user global config.
          set-safe-directory: false
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Converter supply-chain tests (offline)
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build
        run: swift build

      # The pv-pipeline runner asserts the same scenarios as the XCTest targets but
      # also runs on a macOS CommandLineTools-only machine. It covers cache
      # behaviour, sidecars, image I/O, tiling, search primitives, vim state, GPS,
      # Quick Look, archive extraction, and LAN HTTP parsing, address gating, pairing,
      # authorization and phone actions. No model weights required — the stages
      # degrade to identity or a classical fallback when a model is absent.
      # PV_MODELS_DIR is exclusive: empty private stores exercise missing-model
      # fallbacks without consulting the runner's installed models or user data.
      - name: Run the self-verifier
        run: |
          PV_MODELS_DIR=$(mktemp -d)
          export PV_MODELS_DIR
          trap 'rm -rf "$PV_MODELS_DIR"' EXIT
          swift run pv-pipeline

      - name: XCTest targets
        run: |
          PV_MODELS_DIR=$(mktemp -d)
          export PV_MODELS_DIR
          trap 'rm -rf "$PV_MODELS_DIR"' EXIT
          swift test

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Validate packaged app
        run: |
          test -x build/Latent.app/Contents/MacOS/Latent
          plutil -lint build/Latent.app/Contents/Info.plist
          plutil -extract CFBundleDocumentTypes xml1 -o /dev/null build/Latent.app/Contents/Info.plist
          test -n "$(plutil -extract NSLocalNetworkUsageDescription raw -o - build/Latent.app/Contents/Info.plist)"
          codesign --verify --strict --verbose=2 build/Latent.app
