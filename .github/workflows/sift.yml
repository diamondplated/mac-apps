name: Sift

on:
  pull_request:
    paths: ['Sift/**', '.github/workflows/sift.yml']
  push:
    branches: [main]
    paths: ['Sift/**', '.github/workflows/sift.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Sift

jobs:
  build:
    name: Build and test
    runs-on: [self-hosted, macOS, ARM64, air]
    # The runner is someone's desktop and this repo is public: a fork's PR would run its own
    # Package.swift, tests and scripts on that machine. Only branches of this repo get a run;
    # a fork PR is re-pushed to a branch here by a maintainer once its diff has been read.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same-owner native checkout: keep Git ownership checks and avoid copying the user global config.
          set-safe-directory: false
          persist-credentials: false

      # Since hosted macos-15 went away, nothing here catches a break that only an older SDK
      # would reject. Ask for the macOS SDK by name: with Xcode selected and the Command Line
      # Tools also installed, a bare `xcrun --show-sdk-version` resolves the CLT SDK path, then
      # fails to read it through Xcode ("SDK ... cannot be located"). SwiftPM asks by name too.
      - name: Configure compiler caches
        shell: bash
        run: |
          printf 'CLANG_MODULE_CACHE_PATH=%s\n' "$RUNNER_TEMP/clang-module-cache" >> "$GITHUB_ENV"
          printf 'SWIFTPM_MODULECACHE_OVERRIDE=%s\n' "$RUNNER_TEMP/swiftpm-module-cache" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Check frozen source contracts
        run: |
          python3 scripts/check-contracts.py
          python3 scripts/test-contracts.py

      - name: Fetch libduckdb
        run: ./scripts/fetch-duckdb.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The end-to-end surface that replaced browser mode: real files on disk, through the real
      # Session, with its own throwaway ~/.sift per check. Exits non-zero on any failure and
      # names every one. A check that cannot run here (no delta/excel extension on the runner)
      # reports `skip` and does not fail the build.
      - name: Verify end to end
        run: swift run sift --verify

      # The verifier and its loopback HTTP server live in SiftVerify, which only the CLI and the
      # tests link. If the app or the Quick Look extension ever depends on it again, its binary
      # carries those symbols.
      - name: App and extension do not link the verifier
        shell: bash
        run: |
          swift build --product SiftApp --product SiftPreviewExtension
          for product in SiftApp SiftPreviewExtension; do
            bin="$(swift build --show-bin-path)/$product"
            test -f "$bin"
            if [ -n "$(nm "$bin" 2>/dev/null | grep -E 'LoopbackHTTPServer|SiftVerify' || true)" ]; then
              echo "$product links the verifier" >&2
              exit 1
            fi
          done

      # The bundle the app ships, built the way users build it. The Quick Look extension must be
      # inside, sandboxed, hardened, and sealed under the app's own signature. This step builds
      # in place, which does not register anything with LaunchServices or the extension database.
      - name: Build the app with its Quick Look extension
        shell: bash
        run: |
          ./build-app.sh
          app=Sift.app
          appex="$app/Contents/PlugIns/SiftPreview.appex"
          test -x "$appex/Contents/MacOS/SiftPreview"
          codesign --verify --deep --strict "$app"
          test -n "$(codesign -d --entitlements - "$appex" 2>/dev/null | grep 'com.apple.security.app-sandbox' || true)"
          test -n "$(codesign -dv "$appex" 2>&1 | grep 'flags=.*runtime' || true)"
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$appex/Contents/Info.plist")" = com.apple.quicklook.preview
          if [ -n "$(nm "$appex/Contents/MacOS/SiftPreview" "$app/Contents/MacOS/Sift" 2>/dev/null | grep -E 'LoopbackHTTPServer|SiftVerify' || true)" ]; then
            echo "the built bundle links the verifier" >&2
            exit 1
          fi

      # Everything the `Test` step above runs is offline. This is the one place a cold
      # `INSTALL httpfs` / `INSTALL azure` from extensions.duckdb.org is exercised, and the
      # one place the loopback test oracle has to bind a socket inside the runner.
      # `SIFT_REMOTE_FACTS` is scoped to this step, so the main suite above stays offline.
      - name: Remote facts canary (httpfs + azure)
        env:
          SIFT_REMOTE_FACTS: "1"
        run: swift test --filter remoteFact
