name: Release Mac Tools

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in MacTools/Info.plist (X.Y.Z)
        required: true
        type: string
      mode:
        description: Distribution signing mode
        required: true
        type: choice
        default: notarized
        options: [notarized, signedlocal]
      preflight_only:
        description: Check existing signing credentials only; do not build or publish
        type: boolean
        default: false
      publish:
        description: Publish the verified release and signed update feed to GitHub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mac-tools-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, air]
    timeout-minutes: 90
    env:
      # These are certificate/profile names, never private keys or Apple passwords.
      DEVELOPER_ID_APPLICATION_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
      NOTARYTOOL_PROFILE: ${{ vars.NOTARYTOOL_PROFILE }}
      SCREENWREN_SIGNING_IDENTITY: ${{ vars.LOCAL_SIGNING_IDENTITY }}
      SCREENWREN_SIGNING_TIMESTAMP: none
      SPARKLE_TOOLS_DIR: ${{ vars.SPARKLE_TOOLS_DIR }}
      SPARKLE_KEYCHAIN_ACCOUNT: mac-tools
      MACTOOLS_RELEASE_REPOSITORY: ${{ vars.MACTOOLS_RELEASE_REPOSITORY }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_PUBLISH: ${{ inputs.publish }}
      RELEASE_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same-owner native checkout: keep Git ownership checks and avoid copying the user global config.
          set-safe-directory: false
      - name: Configure compiler caches
        shell: bash
        run: |
          printf 'CLANG_MODULE_CACHE_PATH=%s\n' "$RUNNER_TEMP/clang-module-cache" >> "$GITHUB_ENV"
          printf 'SWIFTPM_MODULECACHE_OVERRIDE=%s\n' "$RUNNER_TEMP/swiftpm-module-cache" >> "$GITHUB_ENV"
      - name: Preflight native signing credentials
        shell: bash
        run: |
          if [ "$RELEASE_PREFLIGHT_ONLY" = true ] && [ "$RELEASE_PUBLISH" = true ]; then
            echo "Preflight-only and publish cannot both be selected." >&2
            exit 64
          fi
          args=(--notarized)
          if [ "$RELEASE_MODE" = signedlocal ]; then args=(--local); fi
          if [ "$RELEASE_PREFLIGHT_ONLY" = true ] && [ "$RELEASE_MODE" = signedlocal ]; then
            args+=(--noninteractive)
          fi
          ./scripts/release.sh "${args[@]}" --version "$RELEASE_VERSION" --preflight
      - name: Test all apps
        if: ${{ !inputs.preflight_only }}
        shell: bash
        run: |
          for package in DockPeek ScreenWren ScrollSplit LinkRoutes MacTools; do
            swift test --package-path "$package" --parallel
          done
      - name: Build, verify, and optionally publish
        if: ${{ !inputs.preflight_only }}
        shell: bash
        run: |
          args=(--notarized)
          if [ "$RELEASE_MODE" = signedlocal ]; then args=(--local); fi
          if [ "$RELEASE_PUBLISH" = true ]; then args+=(--publish); fi
          ./scripts/release.sh "${args[@]}" --version "$RELEASE_VERSION"
      - name: Preserve verified release artifacts
        if: ${{ !inputs.preflight_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mac-Tools-${{ inputs.version }}-${{ inputs.mode }}
          path: |
            dist/release/v*/*.zip
            dist/release/v*/*.xml
            dist/release/v*/*.md
            dist/release/v*/*.ed25519
            dist/release/v*/SHA256SUMS
            dist/release/v*/*.json
          if-no-files-found: error
